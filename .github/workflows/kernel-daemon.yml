name: Polybrain Kernel Daemon
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

env:
  ALERT_EMAIL: ajs10845@psu.edu

# Repo default_workflow_permissions is "read" (verified 2026-04-24). Without
# this block the GITHUB_TOKEN cannot push canon commits — the entire reason
# this daemon exists. The Commit canon changes step has been silently 403'ing
# every 6h since launch.
permissions:
  contents: write

jobs:
  run-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run kernel tick
        id: kernel
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          echo "Polybrain kernel daemon tick $(date -u)" | tee /tmp/daemon-report.txt
          echo "---" >> /tmp/daemon-report.txt

          # Count canon rows before
          BEFORE=$(wc -l < canon/default.jsonl 2>/dev/null || echo 0)
          echo "canon_before=$BEFORE" >> /tmp/daemon-report.txt

          # 2026-04-24 substrate fix: prior invocation was
          #   timeout 600 node src/kernel.mjs
          # which booted the kernel into a 10-min idle loop with operators=0,
          # producing zero canon rows. Until external operators are wired
          # into the daemon, scripts/run-daemon.mjs is the autonomous canon
          # emitter — appends one daemon_heartbeat row per tick so canon
          # grows, the file lands on origin/main, and Scientists has
          # something to analyze. Bounded by a 60s timeout because the
          # heartbeat is a constant-time append; anything longer means
          # something's wrong.
          timeout 60 node scripts/run-daemon.mjs 2>&1 | tee -a /tmp/daemon-report.txt || true

          # Count canon rows after
          AFTER=$(wc -l < canon/default.jsonl 2>/dev/null || echo 0)
          DELTA=$((AFTER - BEFORE))
          echo "---" >> /tmp/daemon-report.txt
          echo "canon_after=$AFTER" >> /tmp/daemon-report.txt
          echo "new_rows=$DELTA" >> /tmp/daemon-report.txt

          # Read daemon-progress (runtime state) — distinct from the v1.0.0
          # release tracker at state/progress.json which is frozen.
          if [ -f state/daemon-progress.json ]; then
            echo "daemon_progress=$(cat state/daemon-progress.json)" >> /tmp/daemon-report.txt
          fi

          echo "completed=$(date -u)" >> /tmp/daemon-report.txt
          echo "REPORT<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/daemon-report.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Commit canon changes
        run: |
          git config user.name "Polybrain Daemon"
          git config user.email "daemon@polylogicai.com"
          git add canon/ state/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No canon changes to commit"
          else
            git commit -m "daemon: kernel tick $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

      - name: Email report (only on failure — silence-is-default)
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Pass report + status via env vars so backticks / $() / shell
          # metacharacters in the kernel's stdout don't get evaluated.
          # Prior bug (2026-04-24): REPORT="${{ steps.kernel.outputs.REPORT }}"
          # was template-substituted into the bash script literally, and any
          # backtick in the kernel's output would trigger command substitution
          # — observed: `shipped: command not found` exit 127, daemon failed,
          # canon never got committed, Scientists emailed WARNING for weeks.
          REPORT: ${{ steps.kernel.outputs.REPORT }}
          JOB_STATUS: ${{ job.status }}
        if: always()
        run: |
          SUBJECT="Polybrain Kernel: $JOB_STATUS $(date -u +%Y-%m-%d\ %H:%M)"

          # Always write the audit trail to the GH Actions step summary so
          # every tick is inspectable in the workflow run UI. But only EMAIL
          # on failure — silence-is-default. Andy's inbox was getting one
          # "Polybrain Kernel: success" email every 6h, which is noise. The
          # workflow conclusion + the canon row hash chain are the two
          # honest fingerprints; the email matters only when something
          # broke. Scientists handles the WARNING/CRITICAL email channel
          # for analyzed-anomaly events (drift, broken chain, etc.).
          echo "## Polybrain Kernel Daemon Report" >> $GITHUB_STEP_SUMMARY
          echo "Status: $JOB_STATUS" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$REPORT" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          if [ "$JOB_STATUS" = "success" ]; then
            echo "Daemon succeeded — skipping email (silence-is-default)."
            exit 0
          fi

          # Use Resend API if key available, otherwise use the GH Actions summary
          if [ -n "$RESEND_API_KEY" ]; then
            curl -s -X POST https://api.resend.com/emails \
              -H "Authorization: Bearer $RESEND_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{
                \"from\": \"Polybrain Daemon <alerts@polylogicai.com>\",
                \"to\": \"$ALERT_EMAIL\",
                \"subject\": \"$SUBJECT\",
                \"text\": $(echo "$REPORT" | jq -Rs .)
              }" || echo "Email send failed (non-fatal)"
          else
            echo "No RESEND_API_KEY, skipping email. Report:"
            echo "$REPORT"
          fi
