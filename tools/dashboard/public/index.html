<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title> </title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    background: #000;
    color: #fff;
    font-family: 'SF Mono', ui-monospace, Menlo, Consolas, monospace;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 48px;
  }
  #pct {
    font-size: 200px;
    font-weight: 100;
    letter-spacing: -8px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  #bar {
    width: 56vw;
    max-width: 880px;
    height: 3px;
    background: rgba(255, 255, 255, 0.06);
    overflow: hidden;
  }
  #fill {
    height: 100%;
    background: #F5A623;
    width: 0%;
    transition: width 450ms cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 0 24px rgba(245, 166, 35, 0.35);
  }
</style>
</head>
<body>
  <div id="pct">0%</div>
  <div id="bar"><div id="fill"></div></div>
<script>
  async function tick() {
    try {
      const r = await fetch('/state', { cache: 'no-store' });
      const j = await r.json();
      const pct = Math.max(0, Math.min(100, Math.round((j.complete || 0) * 100)));
      document.getElementById('pct').textContent = pct + '%';
      document.getElementById('fill').style.width = pct + '%';
    } catch (_) {}
  }
  setInterval(tick, 500);
  tick();
</script>
</body>
</html>
